services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synas
      POSTGRES_PASSWORD: synas
      POSTGRES_DB: synas_text_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synas -d synas_text_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://synas:synas@db:5432/synas_text_agent
      DATABASE_URL_SYNC: postgresql://synas:synas@db:5432/synas_text_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
